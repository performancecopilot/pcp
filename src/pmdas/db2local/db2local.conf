# Local IBM Db2 command-line PMDA configuration.
# bin_dir and profile must resolve to absolute paths.  A leading ~/ in either
# path is expanded against the configured Db2 user's home directory, not pcp's.
# db2pd is normally installed in the instance home (sqllib/adm next to the
# profile).  The agent checks bin_dir first, then falls back to sqllib/adm.
[db2]
bin_dir=/opt/ibm/db2/V11.5/bin
user=db2inst1
profile=~/sqllib/db2profile
