# Local IBM Db2 command-line PMDA configuration.
# user and profile identify the Db2 instance to monitor.  A leading ~/ in a
# path is expanded against the configured Db2 user's home directory, not pcp's.
#
# bin_dir is optional and normally left unset: the instance's own sqllib/bin
# and sqllib/adm directories are searched by default (db2pd is installed in
# sqllib/adm).  Db2 points these directories at the installed Db2 copy and
# updates them on fix packs and version upgrades, so no Db2 version needs to
# be configured here.  Set bin_dir only when the tools are not available
# through the instance directories, for example behind container wrappers;
# it must be an absolute path or start with ~/.
[db2]
user=db2inst1
profile=~/sqllib/db2profile
#bin_dir=/path/to/db2/bin
